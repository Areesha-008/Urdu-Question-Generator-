<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body {
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    color: #101828;
    display: grid;
    place-items: center;
    text-align: center;
  }
  .card { width: min(980px, 86vw); animation: rise 1.05s ease both; }
  .brand {
    font-family: "Noto Nastaliq Urdu", "Geeza Pro", serif;
    font-size: 42px;
    line-height: 1.6;
  }
  .studio {
    display: inline-block;
    margin-inline-start: 16px;
    font-size: 13px;
    letter-spacing: 0.28em;
    color: #344e6c;
    font-family: ui-sans-serif, system-ui, sans-serif;
    transform: translateY(-6px);
  }
  .rule { width: 64px; height: 3px; background: #c7a463; margin: 22px auto 34px; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 84px;
    line-height: 1.04;
    margin: 0 0 28px;
  }
  p {
    max-width: 720px;
    margin: 0 auto;
    font-size: 24px;
    line-height: 1.55;
    color: #536274;
  }
  .meta {
    margin-top: 44px;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: #344e6c;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: none; }
  }
</style>
<body>
  <div class="card">
    <div class="brand">سوال <span class="studio">QUESTION STUDIO</span></div>
    <div class="rule"></div>
    <h1>A sentence in.<br>A question out.</h1>
    <p>A from-scratch Urdu encoder-decoder turns a marked answer into a practice question.</p>
    <div class="meta">14.6M parameters · BiGRU + Luong attention · no pretrained weights</div>
  </div>
</body>
</html>
