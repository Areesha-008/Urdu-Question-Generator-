<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>End</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body {
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    color: #101828;
    display: grid;
    place-items: center;
  }
  .card { width: min(1100px, 88vw); animation: rise 1.1s ease both; }
  .eyebrow { font-size: 13px; letter-spacing: 0.28em; color: #344e6c; }
  h1 {
    font-family: Georgia, serif;
    font-weight: 400;
    font-size: 64px;
    line-height: 1.08;
    margin: 18px 0 36px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 22px; }
  article {
    border: 1px solid #d8dde5;
    border-top: 3px solid #c7a463;
    border-radius: 18px;
    padding: 28px 26px 24px;
  }
  .k { font-size: 13px; letter-spacing: 0.08em; color: #344e6c; }
  .v {
    font-family: Georgia, serif;
    font-size: 48px;
    margin: 14px 0 8px;
  }
  .s { color: #536274; font-size: 16px; line-height: 1.5; }
  .foot {
    margin-top: 42px;
    color: #344e6c;
    font-size: 18px;
    line-height: 1.7;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: none; }
  }
</style>
<body>
  <div class="card">
    <div class="eyebrow">TRAINED FROM SCRATCH</div>
    <h1>It runs locally. It asks in Urdu.</h1>
    <div class="grid">
      <article>
        <div class="k">UQA VALIDATION</div>
        <div class="v">11.29</div>
        <div class="s">Beam BLEU-4, beam size 3</div>
      </article>
      <article>
        <div class="k">WIKI-UQA</div>
        <div class="v">9.23</div>
        <div class="s">Held-out out-of-domain split</div>
      </article>
      <article>
        <div class="k">TRAINING</div>
        <div class="v">53:00</div>
        <div class="s">15 epochs on a single T4</div>
      </article>
    </div>
    <div class="foot">
      Write-up on Medium · run <span style="color:#101828">uvicorn app.main:app --port 8011</span>
    </div>
  </div>
</body>
</html>
